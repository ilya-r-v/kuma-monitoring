global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # 5s — чтобы короткие падения БД успевали попасть в метрики
  - job_name: mysqld
    scrape_interval: 5s
    static_configs:
      - targets: ["mysqld-exporter-1:9104"]
        labels: { node: galera-1 }
      - targets: ["mysqld-exporter-2:9104"]
        labels: { node: galera-2 }
      - targets: ["mysqld-exporter-3:9104"]
        labels: { node: galera-3 }

  # встроенный Prometheus-экспортер HAProxy
  - job_name: haproxy
    scrape_interval: 5s
    static_configs:
      - targets: ["haproxy:8404"]

  - job_name: blackbox-http
    scrape_interval: 5s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://uptime-kuma:3001"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
