name: kuma-monitoring

x-mysqld-exporter: &mysqld-exporter
  image: prom/mysqld-exporter:v0.17.2
  restart: unless-stopped
  environment:
    MYSQLD_EXPORTER_PASSWORD: ${EXPORTER_DB_PASSWORD}
  networks: [kuma-net]

services:
  prometheus:
    build: ./prometheus
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks: [kuma-net]

  grafana:
    image: grafana/grafana:12.1.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks: [kuma-net]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [kuma-net]

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    networks: [kuma-net]

  # по одному экспортеру на каждую ноду Galera
  mysqld-exporter-1:
    <<: *mysqld-exporter
    container_name: mysqld-exporter-1
    command: ["--mysqld.address=galera-1:3306", "--mysqld.username=exporter"]

  mysqld-exporter-2:
    <<: *mysqld-exporter
    container_name: mysqld-exporter-2
    command: ["--mysqld.address=galera-2:3306", "--mysqld.username=exporter"]

  mysqld-exporter-3:
    <<: *mysqld-exporter
    container_name: mysqld-exporter-3
    command: ["--mysqld.address=galera-3:3306", "--mysqld.username=exporter"]

  blackbox-exporter:
    build: ./blackbox
    container_name: blackbox-exporter
    restart: unless-stopped
    networks: [kuma-net]

volumes:
  prometheus-data:
  grafana-data:

networks:
  kuma-net:
    external: true