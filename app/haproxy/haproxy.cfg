global
    log stdout format raw local0

# DNS Docker: после перезапуска контейнера его IP меняется,
# HAProxy должен перерезолвить имя, а не держать старый адрес
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

defaults
    mode tcp
    log global
    timeout connect 5s
    timeout client 1h
    timeout server 1h

frontend mysql
    bind *:3306
    default_backend galera

backend galera
    # один писатель: весь трафик на galera-1, остальные в резерве
    option mysql-check user haproxy post-41
    default-server check inter 2s fall 2 rise 2 resolvers docker init-addr last,libc,none
    server galera-1 galera-1:3306
    server galera-2 galera-2:3306 backup
    server galera-3 galera-3:3306 backup

# страница статистики и метрики для Prometheus (встроенный экспортер HAProxy)
frontend stats
    mode http
    bind *:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 5s
